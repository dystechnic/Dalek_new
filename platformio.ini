[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Serial monitor ────────────────────────────────────────────────
monitor_speed = 115200

; ── Libraries ─────────────────────────────────────────────────────
lib_deps =
    ; WS2811 eyestalk LED
    fastled/FastLED
    ; MP3 sound module
    dfrobot/DFRobotDFPlayerMini
    ; Hardware-timer stepper (replaces AccelStepper)
    gin66/FastAccelStepper

; ── Build flags ───────────────────────────────────────────────────
build_flags =
    ; set to 5 for verbose ESP-IDF logs
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ARCH_ESP32

; ── Extra config (WiFi credentials - keep this file out of git!) ──
extra_configs = secrets.ini